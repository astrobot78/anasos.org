name: Deploy ANAS OS to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate and Deploy
        run: |
          cat << 'EOF' > $HOME/sa.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EOF
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/sa.json
          npx firebase-tools deploy --only hosting --project anas-os-org --non-interactive
